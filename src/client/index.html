<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🦄 Unstable Unicorns Online</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦄</text></svg>" />
</head>
<body>
  <div id="app">
    <section id="screen-home" class="screen">
      <div class="home-card">
        <h1 class="logo">🦄 <span>Unstable Unicorns</span> <small>Online</small></h1>
        <p class="tagline">建立你的獨角獸軍團，摧毀朋友的夢想 ✨</p>
        <label>你的暱稱</label>
        <input id="inp-name" maxlength="16" placeholder="例如：彩虹小馬殺手" />
        <div class="btn-row">
          <button id="btn-create" class="btn primary">🎪 建立房間</button>
        </div>
        <div class="join-row">
          <input id="inp-code" maxlength="8" placeholder="房間代碼" style="text-transform:uppercase" />
          <button id="btn-join" class="btn">🚪 加入房間</button>
        </div>
        <p class="hint">2–8 人 · 率先湊齊 7 隻獨角獸（6 人以上為 6 隻）者獲勝</p>
        <div id="home-error" class="error hidden"></div>
      </div>
    </section>

    <section id="screen-lobby" class="screen hidden">
      <div class="lobby-card">
        <h2>🎪 房間大廳</h2>
        <div class="code-row">
          <span class="room-code" id="lobby-code">------</span>
          <button id="btn-copy" class="btn small">📋 複製邀請連結</button>
        </div>
        <ul id="lobby-players" class="player-list"></ul>
        <div class="btn-row">
          <button id="btn-start" class="btn primary">🚀 開始遊戲（至少 2 人）</button>
          <button id="btn-leave-lobby" class="btn danger">離開</button>
        </div>
      </div>
    </section>

    <section id="screen-game" class="screen hidden">
      <header id="game-topbar">
        <span class="mini-code" id="topbar-code"></span>
        <span class="pile-info">牌庫 <b id="cnt-deck">0</b></span>
        <span class="pile-info">棄牌 <b id="cnt-discard">0</b></span>
        <span class="pile-info">育嬰室 <b id="cnt-nursery">0</b></span>
        <span id="turn-banner"></span>
        <button id="btn-sacrifice-mode" class="btn small">🗡️ 犧牲模式</button>
        <button id="btn-open-chat" class="btn small">💬</button>
      </header>

      <div id="main-row">
        <section id="opponents"></section>
        <aside id="right-sidebar">
          <div id="center-piles">
            <div class="pile deck-pile" title="牌庫"></div>
            <div class="pile discard-pile" id="discard-show" title="點擊檢視棄牌堆"></div>
            <div class="pile nursery-pile" title="育嬰室"></div>
          </div>
          <aside id="log-panel"><h3>📜 戰報</h3><div id="log-list"></div></aside>
        </aside>
      </div>

      <section id="my-area">
        <div id="my-stable-wrap">
          <h3>🐴 我的馬廄（<span id="my-count">0</span>/<span id="win-target">7</span>）</h3>
          <div id="my-stable"></div>
        </div>
        <div id="prompt-bar" class="hidden"></div>
        <div id="neigh-bar" class="hidden">
          <span id="neigh-text"></span>
          <button id="btn-neigh" class="btn neigh-btn">🐴 Neigh！</button>
          <button id="btn-pass" class="btn small">算了…</button>
        </div>
        <h3>🖐️ 我的手牌 <span id="draw-slot"></span></h3>
        <div id="my-hand"></div>
      </section>
    </section>

    <div id="chat-panel" class="hidden">
      <div id="chat-log"></div>
      <form id="chat-form"><input id="chat-inp" placeholder="說點什麼…" autocomplete="off" /><button class="btn small">送出</button></form>
    </div>

    <div id="modal" class="hidden"><div id="modal-box"></div></div>
    <div id="toast-wrap"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
